name: Performance Benchmark

on:
  pull_request:
  schedule:
    # Nightly at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      threshold:
        description: 'Regression threshold percentage'
        required: false
        default: '10'

permissions:
  contents: read

jobs:
  benchmark:
    name: Run JMH Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Record hardware info
        run: |
          echo "## Hardware" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          lscpu | grep -E "Model name|CPU\(s\)|MHz|cache" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          lscpu | grep -E "Model name|CPU\(s\)|MHz|cache"

      - name: Build benchmark JAR
        run: mvn package -Pbench -pl lcl-benchmarks -am -DskipTests -q

      - name: Run benchmarks (current)
        working-directory: lcl-benchmarks
        run: |
          mkdir -p results
          java -jar target/benchmarks.jar -rf json -rff results/current-results.json

      - name: Resolve reference commit
        id: reference
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            REF_SHA="${{ github.event.pull_request.base.sha }}"
            REF_LABEL="pull_request_base"
          else
            REF_SHA="$(git rev-parse HEAD^ 2>/dev/null || true)"
            REF_LABEL="previous_commit"
          fi

          if [ -z "$REF_SHA" ]; then
            echo "has_reference=false" >> "$GITHUB_OUTPUT"
            echo "reference_label=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "has_reference=true" >> "$GITHUB_OUTPUT"
          echo "reference_sha=$REF_SHA" >> "$GITHUB_OUTPUT"
          echo "reference_label=$REF_LABEL" >> "$GITHUB_OUTPUT"

      - name: Build and run benchmarks (reference)
        if: steps.reference.outputs.has_reference == 'true'
        shell: bash
        run: |
          rm -rf .benchmark-reference
          git worktree add --detach .benchmark-reference "${{ steps.reference.outputs.reference_sha }}"
          pushd .benchmark-reference >/dev/null
          mvn package -Pbench -pl lcl-benchmarks -am -DskipTests -q
          mkdir -p lcl-benchmarks/results
          pushd lcl-benchmarks >/dev/null
          java -jar target/benchmarks.jar -rf json -rff results/reference-results.json
          popd >/dev/null
          popd >/dev/null

      - name: Compare against reference
        id: compare
        if: steps.reference.outputs.has_reference == 'true'
        run: |
          THRESHOLD="${{ github.event.inputs.threshold || '10' }}"
          python scripts/compare-baseline.py \
            lcl-benchmarks/results/current-results.json \
            .benchmark-reference/lcl-benchmarks/results/reference-results.json \
            --threshold "$THRESHOLD" \
            --candidate-label current \
            --reference-label "${{ steps.reference.outputs.reference_label }}"

      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-results
          path: |
            lcl-benchmarks/results/current-results.json
            .benchmark-reference/lcl-benchmarks/results/reference-results.json
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          echo "## Benchmark Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f lcl-benchmarks/results/current-results.json ]; then
            echo "Results uploaded as artifact: **benchmark-results**" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Threshold: ${{ github.event.inputs.threshold || '10' }}%" >> $GITHUB_STEP_SUMMARY
          echo "Reference: ${{ steps.reference.outputs.reference_label || 'none' }}" >> $GITHUB_STEP_SUMMARY

      - name: Cleanup reference worktree
        if: always() && steps.reference.outputs.has_reference == 'true'
        shell: bash
        run: git worktree remove --force .benchmark-reference
